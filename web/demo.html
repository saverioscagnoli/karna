<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>karna donut</title>
    <!-- Satisfies the wasi_snapshot_preview1 imports (exit-time stdio that
         can never run in a browser) with wasi-shim.js -->
    <script type="importmap">
      { "imports": { "wasi_snapshot_preview1": "./wasi-shim.js" } }
    </script>
    <link data-trunk rel="copy-file" href="wasi-shim.js" />
    <link data-trunk rel="rust" data-bin="demo" />
    <script>
      // Embedded/preview browsers can keep the page "hidden", which
      // suspends requestAnimationFrame entirely and freezes the engine's
      // frame loop. While hidden, fall back to a 16ms timer; negative ids
      // mark timer handles so cancellation stays correct.
      (() => {
        const raf = window.requestAnimationFrame.bind(window);
        const caf = window.cancelAnimationFrame.bind(window);

        window.requestAnimationFrame = (cb) =>
          document.visibilityState === "hidden"
            ? -setTimeout(() => cb(performance.now()), 16)
            : raf(cb);

        window.cancelAnimationFrame = (id) =>
          id < 0 ? clearTimeout(-id) : caf(id);
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0b0b0e;
        overflow: hidden;
      }

      canvas {
        display: block;
        margin: 0 auto;
        outline: none;
      }
    </style>
  </head>
  <body></body>
</html>
