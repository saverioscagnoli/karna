[package]
name = "karna"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["engine", "gpu","logging", "math", "renderer", "utils"]

[workspace.dependencies]
parking_lot = "0.12.5"
wgpu = { version = "30.0.0", default-features = false, features = ["wgsl", "vulkan"] }
utils = { path = "utils" }
winit = "0.30.13"
math = {path = "math" }
logging = { path = "logging" }
gpu = { path = "gpu" }
renderer = { path = "renderer" }


[dependencies]
logging.workspace = true
engine = { path = "engine" }
math.workspace = true
renderer.workspace = true

[dev-dependencies]
log = "0.4.33"
