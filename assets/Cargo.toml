[package]
name = "assets"
version = "0.1.0"
edition = "2024"

[dependencies]
parking_lot.workspace = true
math.workspace = true
wgpu.workspace = true
gpu.workspace = true
utils.workspace = true
logging.workspace = true
image.workspace = true
rect_packer = "0.2.1"
ab_glyph = "0.2.32"
rodio.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Pulled in transitively via rodio -> rand; the web backend must be
# opted into explicitly (together with the cfg in .cargo/config.toml).
getrandom = { version = "0.4", features = ["wasm_js"] }
