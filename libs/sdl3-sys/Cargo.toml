[package]
name = "karna-sdl3-sys"
description = "Raw FFI bindings to SDL3 for the karna engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
links = "SDL3"

[lib]
name = "sdl3_sys"
path = "src/lib.rs"
# SDL doc comments contain C snippets that rustdoc would try to run as Rust.
doctest = false

[features]
default = ["bundled"]
bundled = []
system = []
# Regenerate crates/sdl3/generated/sdl3.rs from the SDL headers via bindgen
# instead of using the checked-in copy. Needed when the SDL version changes
# or when the checked-in bindings (generated on Linux) don't match your
# target platform. Off by default so ordinary builds skip bindgen/clang-sys
# and its whole dependency tree.
codegen = ["dep:bindgen"]

[build-dependencies]
bindgen = { version = "0.72.1", optional = true }
cmake = "0.1.58"
pkg-config = "0.3.33"
