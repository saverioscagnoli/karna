[package]
name = "karna"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["engine", "gpu", "logging", "math", "packer", "utils"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
gpu = { path = "gpu" }
logging = { path = "logging" }
math = { path = "math" }
utils = { path = "utils" }

sdl3 = { version = "0.18.4", features = ["raw-window-handle", "image", "ttf", "build-from-source-static"] }
parking_lot = "0.12.5"

[dependencies]
engine = { path = "engine" }

logging.workspace = true
math.workspace = true
utils.workspace = true

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
