[package]
name = "karna-lua-sys"
description = "Raw FFI bindings to Lua for the karna engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
links = "lua"

[lib]
name = "lua_sys"
path = "src/lib.rs"
# Lua doc comments contain C snippets that rustdoc would try to run as Rust.
doctest = false

[features]
default = ["build-from-source"]
# Build Lua from the vendored source tree in vendor/lua instead of linking a
# system Lua. On by default; turn it off with --no-default-features to link a
# system Lua 5.5 via pkg-config.
build-from-source = []
# Only needed to regenerate src/bindings.rs; not used in a normal build.
regenerate = ["dep:bindgen"]

[dependencies]

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[[bin]]
name = "regenerate-bindings"
path = "src/bin/regenerate.rs"
required-features = ["regenerate"]

[dependencies.bindgen]
version = "0.72"
optional = true
