[package]
name = "karna"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["math", "logging", "utils", "engine", "gpu"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
gpu = { path = "gpu" }
logging = { path = "logging" }
math = { path = "math" }
utils = { path = "utils" }

sdl3 = { version = "0.18.4", features = ["image", "ttf"] }
parking_lot = "0.12.5"

[dependencies]
engine = { path = "engine" }
logging.workspace = true
math.workspace = true
utils.workspace = true

[dev-dependencies]
