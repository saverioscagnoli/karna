[package]
name = "karna-sdl3-mixer-sys"
description = "Raw FFI bindings to SDL3_mixer for the karna engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
links = "SDL3_mixer"

[lib]
name = "sdl3_mixer_sys"
path = "src/lib.rs"
doctest = false

[features]
default = ["build-from-source"]
build-from-source = ["dep:cmake", "karna-sdl3-sys/build-from-source"]
regenerate = ["dep:bindgen"]

[dependencies]
karna-sdl3-sys.workspace = true

[build-dependencies]
cmake = { version = "0.1", optional = true }
pkg-config = "0.3"

[[bin]]
name = "regenerate-bindings"
path = "src/bin/regenerate.rs"
required-features = ["regenerate"]

[dependencies.bindgen]
version = "0.72"
optional = true
